<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Styled Sample Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="main-title">Welcome to My Styled Website</h1>
    </header>

    <nav class="content-section">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>

    <main>
        <section id="home" class="content-section">
            <h2>Home</h2>
            <p>This homepage now has improved typography and layout!</p>
            <img src="https://images.pexels.com/photos/414171/pexels-photo-414171.jpeg" alt="Nature image">
        </section>

        <section id="about" class="content-section">
            <h2>About</h2>
            <p>Styled with margins, padding, borders, and a fresh font!</p>
        </section>
    </main>

    <footer class="content-section">
        <p>Contact us at: <a href="mailto:info@example.com">info@example.com</a></p>
    </footer>

</body>
</html>
